<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Good Luck</title>
  <style>
    :root { --ink: #1b1918; --paper: #e5e3e0; --y: #f2d21b; --g: #4bc430; --b: #22a1e2; --r: #c13827; --pink: #d63057; --sand: #dfd5a3; }
    body { margin: 0; min-height: 100vh; background: var(--ink); color: var(--paper); font: 16px/1.5 ui-monospace, Menlo, monospace;
      display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
    main { max-width: 520px; width: 100%; }
    h1 { font-size: 44px; line-height: 1; margin: 0 0 8px; letter-spacing: 1px; text-transform: uppercase; }
    h1 span:nth-child(1) { color: var(--y); } h1 span:nth-child(2) { color: var(--g); }
    .bar { display: flex; height: 6px; margin-bottom: 24px; }
    .bar i { flex: 1; } .bar i:nth-child(1) { background: var(--y); } .bar i:nth-child(2) { background: var(--g); }
    .bar i:nth-child(3) { background: var(--b); } .bar i:nth-child(4) { background: var(--r); }
    a.game { display: block; padding: 16px 18px; background: var(--sand); color: var(--ink); text-decoration: none;
      border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--pink); transform: rotate(-1.5deg); }
    a.game:hover { transform: rotate(0deg); }
    a.game b { display: block; font-size: 22px; text-transform: uppercase; }
    p.soon { color: #6e6c68; margin-top: 28px; }
  </style>
</head>
<body>
  <main>
    <h1><span>Good</span> <span>Luck</span></h1>
    <div class="bar"><i></i><i></i><i></i><i></i></div>
    <a class="game" href="showdown/"><b>Four Color Showdown</b>Top-Down-Arena-Shooter vor dem Diner. Vier Killjoys, vier Farben, endlose Dracs.</a>
    <p class="soon">Später: Highway Shootout – siehe PLAN.md</p>
  </main>
</body>
</html>
